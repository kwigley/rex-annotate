name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.1
      - name: Shell scripts
        run: shellcheck install.sh scripts/smoke.sh
      - name: Lua syntax (Rex runs Lua 5.1)
        run: luac5.1 -p annotate.lua
